services:

  postgres:
    image: postgres:17
    container_name: wildchild-postgres
    environment:
      POSTGRES_DB: wildchild
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME:-wildchild}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    image: wildchild-management:1.0
    container_name: wildchild-management
    ports:
      - "8080:8080"

    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}

    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data: