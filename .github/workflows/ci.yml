name: CI

on:
  push:
    branches:
      - main
permissions:
  id-token: write
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: wildchild
          POSTGRES_USER: wildchild_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U wildchild_user -d wildchild"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      SPRING_PROFILES_ACTIVE: test
      TEST_DB_URL: jdbc:postgresql://localhost:5432/wildchild
      TEST_DB_USERNAME: wildchild_user
      TEST_DB_PASSWORD: test_password
      TEST_JWT_SECRET: ig5xbDmyN5xB0lIQPqkFRbYEvsa+TJEgxcxIBlMsk8o=
      OWNER_EMAIL: mehrotrahardy@example.com
      OWNER_PASSWORD: test-password
      OWNER_FIRST_NAME: Test
      OWNER_LAST_NAME: Owner
      OWNER_PHONE_NUMBER: "0000000000"

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: mvn --batch-mode verify
      - name: Build Docker image
        run: docker build -t wildchild-management:ci .
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::630171691142:role/GitHubActionsWildChildECRRole
          aws-region: ap-south-1
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Tag Docker image
        run: |
          docker tag wildchild-management:ci \
            630171691142.dkr.ecr.ap-south-1.amazonaws.com/wildchild-management:${{ github.sha }}

      - name: Push Docker image
        run: |
          docker push \
            630171691142.dkr.ecr.ap-south-1.amazonaws.com/wildchild-management:${{ github.sha }}

      - name: Download current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition wildchild-management:6 \
            --query taskDefinition \
            > task-definition.json

      - name: Render ECS task definition
        id: render-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: Main
          image: 630171691142.dkr.ecr.ap-south-1.amazonaws.com/wildchild-management:${{ github.sha }}

      - name: Verify ECS service
        run: |
          aws ecs describe-services \
            --cluster wildchild-cluster \
            --services wildchild-management-service
          

      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-definition.outputs.task-definition }}
          service: wildchild-management-service
          cluster: wildchild-cluster
          wait-for-service-stability: true